<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        form {
            width: 500px;
            margin: auto;
        }

        label {
            display: inline-block;
            width: 130px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 6px;
            width: 250px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 8px 20px;
            margin-left: 130px;
        }
    </style>
</head>

<body>

    <h1>User Registration Form</h1>

    <form action="/server" method="POST">

        <label>Name:</label>
        <input 
            type="text" 
            name="name"
            required
        >
        <br>

        <label>Password:</label>
        <input 
            type="password" 
            name="password"
            required
        >
        <br>

        <label>Age:</label>
        <input 
            type="number" 
            name="age"
            min="1"
            max="100"
            required
        >
        <br>

        <label>Mobile Number:</label>
        <input 
            type="tel" 
            name="mobile"
            pattern="[0-9]{10}"
            title="Enter 10 digit mobile number"
            required
        >
        <br>

        <label>Email:</label>
        <input 
            type="email" 
            name="email"
            required
        >
        <br>

        <label>Gender:</label>

        <input 
            type="radio" 
            name="gender" 
            value="Male"
            required
        > Male

        <input 
            type="radio" 
            name="gender" 
            value="Female"
        > Female

        <br><br>

        <label>State:</label>

        <select name="state" required>
            <option value="">Select State</option>
            <option value="Kerala">Kerala</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
        </select>

        <br><br>

        <label>Skills:</label>

        <input 
            type="checkbox" 
            name="skills" 
            value="JavaScript"
        > JavaScript

        <input 
            type="checkbox" 
            name="skills" 
            value="Python"
        > Python

        <input 
            type="checkbox" 
            name="skills" 
            value="C++"
        > C++

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
